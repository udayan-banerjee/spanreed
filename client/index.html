<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Spanreed</title>
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Spanreed</h1>

    <div class="home-screen">
      <p class="premise">Write here. It appears there.</p>

      <button id="create">Open a channel</button>

      <p class="fork"><span>or join one</span></p>

      <div class="join">
        <label for="roomcode">Room code</label>
        <input
          type="text"
          id="roomcode"
          maxlength="4"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
          placeholder="0000"
        />
        <button id="join">Join</button>
      </div>
    </div>

    <div class="room-screen" hidden>
      <h3 id="copycode"></h3>
      <p>Give these four digits to the other person.</p>
      <p class="quiet">Waiting for the other person.</p>
    </div>

    <p id="errormsg" role="status" aria-live="polite"></p>

    <div class="joined-room" hidden>
      <h2>Spanreed</h2>
      <p class="room-notice" role="status" aria-live="polite" hidden></p>
      <div class="message-display" aria-live="polite"></div>
      <form id="messageForm">
        <label class="sr-only" for="message">Text to send</label>
        <textarea
          id="message"
          placeholder="Type or paste anything"
          rows="2"
        ></textarea>
        <button type="submit">Send</button>

        <label class="drop" for="files">
          <span class="drop-icon" aria-hidden="true"></span>
          <span class="drop-text">Choose a file to send</span>
        </label>
        <input type="file" id="files" class="sr-only" multiple/>
      </form>
    </div>
  </body>
</html>
